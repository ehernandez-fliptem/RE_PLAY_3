<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura general de Recepcion Electronica</title>
  <desc id="desc">Diagrama tecnico con usuarios, frontend, backend, base de datos, servicios auxiliares e integraciones.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .band { fill: #ffffff; stroke: #c9d3df; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #506176; stroke-width: 2; rx: 8; }
      .box-blue { fill: #e9f3ff; stroke: #2666a6; }
      .box-green { fill: #edf8f1; stroke: #2f7d4f; }
      .box-orange { fill: #fff4e5; stroke: #b86500; }
      .box-red { fill: #fff0f0; stroke: #b94545; }
      .box-gray { fill: #f0f3f7; stroke: #596678; }
      .title { font: 700 28px Arial, sans-serif; fill: #172233; }
      .section { font: 700 17px Arial, sans-serif; fill: #263548; }
      .label { font: 700 15px Arial, sans-serif; fill: #172233; }
      .small { font: 13px Arial, sans-serif; fill: #344256; }
      .tiny { font: 12px Arial, sans-serif; fill: #536173; }
      .arrow { stroke: #425166; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #6d7c8f; stroke-width: 2; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 7 5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#425166" />
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6d7c8f" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760" />

  <text class="title" x="50" y="54">Arquitectura general del sistema Recepcion Electronica (RE)</text>
  <text class="small" x="50" y="82">Vista de alto nivel de componentes, comunicacion y servicios de soporte.</text>

  <rect class="band" x="40" y="110" width="260" height="560" rx="10" />
  <text class="section" x="65" y="145">Usuarios y clientes</text>

  <rect class="box box-gray" x="70" y="175" width="200" height="72" />
  <text class="label" x="95" y="204">Navegador web</text>
  <text class="small" x="95" y="226">Administrador, recepcion,</text>
  <text class="small" x="95" y="244">reportes e internos</text>

  <rect class="box box-gray" x="70" y="282" width="200" height="72" />
  <text class="label" x="99" y="311">Kiosco / tablet</text>
  <text class="small" x="104" y="333">Consulta y registro</text>
  <text class="small" x="124" y="351">de eventos</text>

  <rect class="box box-gray" x="70" y="389" width="200" height="72" />
  <text class="label" x="113" y="418">Visitantes</text>
  <text class="small" x="101" y="440">QR, liga de registro</text>
  <text class="small" x="122" y="458">y correo</text>

  <rect class="box box-gray" x="70" y="496" width="200" height="72" />
  <text class="label" x="111" y="525">Contratistas</text>
  <text class="small" x="100" y="547">Portal y solicitudes</text>

  <rect class="band" x="340" y="110" width="250" height="560" rx="10" />
  <text class="section" x="365" y="145">Frontend</text>

  <rect class="box box-blue" x="370" y="185" width="190" height="94" />
  <text class="label" x="425" y="214">React</text>
  <text class="small" x="400" y="236">Vite + TypeScript</text>
  <text class="small" x="394" y="256">Material UI / Redux</text>

  <rect class="box box-blue" x="370" y="325" width="190" height="94" />
  <text class="label" x="423" y="354">Rutas</text>
  <text class="small" x="393" y="376">Menu por permisos</text>
  <text class="small" x="398" y="396">Pantallas RE</text>

  <rect class="box box-blue" x="370" y="465" width="190" height="94" />
  <text class="label" x="418" y="494">Axios</text>
  <text class="small" x="405" y="516">API REST</text>
  <text class="small" x="391" y="536">Socket.IO Client</text>

  <rect class="band" x="630" y="110" width="290" height="560" rx="10" />
  <text class="section" x="655" y="145">Backend</text>

  <rect class="box box-green" x="660" y="170" width="230" height="78" />
  <text class="label" x="721" y="199">Express API</text>
  <text class="small" x="696" y="221">Node.js + TypeScript</text>

  <rect class="box box-green" x="660" y="280" width="230" height="78" />
  <text class="label" x="712" y="309">Middlewares</text>
  <text class="small" x="690" y="331">JWT, roles, rate limit, logs</text>

  <rect class="box box-green" x="660" y="390" width="230" height="78" />
  <text class="label" x="718" y="419">Controladores</text>
  <text class="small" x="689" y="441">Usuarios, visitantes, eventos,</text>
  <text class="small" x="722" y="459">reportes y config</text>

  <rect class="box box-green" x="660" y="500" width="230" height="78" />
  <text class="label" x="722" y="529">Procesos cron</text>
  <text class="small" x="696" y="551">Finalizacion, documentos,</text>
  <text class="small" x="704" y="569">anonimizacion y sync</text>

  <rect class="band" x="960" y="110" width="280" height="560" rx="10" />
  <text class="section" x="985" y="145">Servicios y datos</text>

  <rect class="box box-orange" x="990" y="175" width="220" height="78" />
  <text class="label" x="1060" y="204">MongoDB</text>
  <text class="small" x="1022" y="226">Colecciones del sistema,</text>
  <text class="small" x="1044" y="244">bitacora y eventos</text>

  <rect class="box box-orange" x="990" y="290" width="220" height="78" />
  <text class="label" x="1051" y="319">Correo SMTP</text>
  <text class="small" x="1028" y="341">QR, recuperacion, avisos</text>

  <rect class="box box-red" x="990" y="405" width="220" height="78" />
  <text class="label" x="1049" y="434">Dispositivos</text>
  <text class="small" x="1018" y="456">Hikvision / BioStar / camara</text>

  <rect class="box box-red" x="990" y="520" width="220" height="78" />
  <text class="label" x="1044" y="549">Integraciones</text>
  <text class="small" x="1022" y="571">QR, Azure, contratistas,</text>
  <text class="small" x="1051" y="589">registro campo</text>

  <path class="arrow" d="M270 211 H370" />
  <path class="arrow" d="M270 318 H370" />
  <path class="arrow" d="M270 425 H370" />
  <path class="arrow-soft" d="M270 532 C320 532 320 512 370 512" />

  <path class="arrow" d="M560 232 H660" />
  <path class="arrow" d="M560 372 H660" />
  <path class="arrow-soft" d="M560 512 H660" />

  <path class="arrow" d="M890 209 H990" />
  <path class="arrow-soft" d="M890 319 H990" />
  <path class="arrow-soft" d="M890 429 H990" />
  <path class="arrow-soft" d="M890 539 H990" />

  <path class="arrow-soft" d="M990 214 C940 214 940 539 890 539" />
  <path class="arrow-soft" d="M660 538 C615 538 615 612 560 612 H465 V559" />

  <rect class="box" x="320" y="690" width="640" height="42" />
  <text class="tiny" x="345" y="716">Flujos principales: HTTPS/API REST, WebSocket para tiempo real, procesos cron para automatizacion, SMTP para notificaciones e integraciones opcionales por configuracion.</text>
</svg>
